    sessionStorage.removeItem("eshLoggedIn");

    window.location.replace("esh-login.html");

/* =========================================================
   GOOGLE APPS SCRIPT
   ========================================================= */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyvYdD4VfoUM-vD5yS2AdJ_vCSNOU3TE6qY1J9ZIqFHqndGF-a_LXbX0GDmmU3A5VRrIw/exec";


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let reports = [];
let selectedReport = null;
let showOverdueOnly = false;


/* =========================================================
   LOAD REPORTS
   ========================================================= */

async function loadReports(){

    const grid =
        document.getElementById("reportsGrid");


    if(reports.length === 0){

        grid.innerHTML = `
        <div class="loading">

            <div class="spinner"></div>

            Loading ESH reports...

        </div>`;
    }


    try{

        const response =
            await fetch(
                GOOGLE_SCRIPT_URL + "?test=reports"
            );


        if(!response.ok){

            throw new Error(
                "Network response failed"
            );
        }


        const data =
            await response.json();


        if(Array.isArray(data)){

            reports = data;

        }else if(Array.isArray(data.reports)){

            reports = data.reports;

        }else{

            reports = [];
        }


        console.log(
            "ESH reports loaded:",
            reports
        );


        updateDashboard();

        renderReports();


    }catch(error){

        console.error(
            "Load reports error:",
            error
        );


        grid.innerHTML = `
        <div class="empty-state">

            <div class="empty-icon">⚠</div>

            <div class="empty-title">
                Unable to load reports
            </div>

            <div class="empty-text">
                Please check your connection and
                Google Apps Script deployment.
            </div>

        </div>`;
    }
}

function countStatus(status){

    return reports.filter(
        report =>
            normalizeStatus(report.status) ===
            normalizeStatus(status)
    ).length;
}


/* =========================================================
   OVERDUE
   ========================================================= */

function isReportOverdue(report){

    if(
        normalizeStatus(report.status) ===
        "closed"
    ){

        return false;
    }


    if(!report.dueDate){

        return false;
    }


    const due =
        parseDate(report.dueDate);


    if(!due){

        return false;
    }


    const today =
        new Date();


    today.setHours(
        0,0,0,0
    );


    due.setHours(
        0,0,0,0
    );


    return due < today;
}


function calculateOverdue(){

    return reports.filter(
        isReportOverdue
    ).length;
}

/* =========================================================
   ACTIVE FILTER
   ========================================================= */

function updateActiveFilter(){

    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    const category =
        document.getElementById(
            "categoryFilter"
        ).value;


    const search =
        document.getElementById(
            "searchInput"
        ).value.trim();


    const active =
        document.getElementById(
            "activeFilter"
        );


    const textEl =
        document.getElementById(
            "activeFilterText"
        );


    let text = "";


    if(showOverdueOnly){

        text = "Showing overdue cases";

    }else if(status){

        text = "Status: " + status;

    }else if(category){

        text = "Category: " + category;

    }else if(search){

        text = "Search: " + search;
    }


    if(text){

        active.classList.remove(
            "hidden"
        );

        textEl.textContent = text;

    }else{

        active.classList.add(
            "hidden"
        );
    }
}


/* =========================================================
   REPORTS
   ========================================================= */

function renderReports(){

    const grid =
        document.getElementById(
            "reportsGrid"
        );


    const search =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();


    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    const category =
        document.getElementById(
            "categoryFilter"
        ).value;


    const filtered =
        reports.filter(report => {


            const searchable = [

                report.reportNumber,

                report.location,

                report.department,

                report.hazardCategory,

                report.category,

                report.whatHappened,

                report.narrative,

                report.incidentInfo,

                report.reporterName

            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


            if(
                search &&
                !searchable.includes(search)
            ){

                return false;
            }


            if(
                status &&
                normalizeStatus(
                    report.status
                ) !==
                normalizeStatus(status)
            ){

                return false;
            }


            const reportCategory =
                report.hazardCategory ||
                report.category ||
                "";


            if(
                category &&
                reportCategory !== category
            ){

                return false;
            }


            if(
                showOverdueOnly &&
                !isReportOverdue(report)
            ){

                return false;
            }


            return true;
        });


    updateActiveFilter();


    if(filtered.length === 0){

        grid.innerHTML = `
        <div class="empty-state">

            <div class="empty-icon">
                🔎
            </div>

            <div class="empty-title">
                No reports found
            </div>

            <div class="empty-text">
                Try changing your search
                or filter criteria.
            </div>

        </div>`;

        return;
    }


    grid.innerHTML =
        filtered
        .map(createReportCard)
        .join("");
}


/* =========================================================

        isReportOverdue(report);


    let statusClass =
        getStatusClass(status);

    const number =
        escapeHtml(
            report.reportNumber ||
            ("REPORT-" + rowNumber)

    const location =
        escapeHtml(
            report.location || "-"
        );


    const department =
        escapeHtml(
            report.department || "-"
        );


    const category =
        escapeHtml(
            report.hazardCategory ||
            report.category ||
            "-"
        );


    const narrative =
        escapeHtml(
            report.whatHappened ||
            report.narrative ||
            report.incidentInfo ||

        );


    const date =

            formatDisplayDate(

                report.timestamp ||

        );


    return `

    <div

            <div>

                ${escapeHtml(status)}

            ${category}
        </div>


        <div class="report-description">

            ${narrative.substring(0,180)}

                narrative.length > 180
                ? "..."
                : ""

        </div>


        <div class="report-meta">

            <div>

                <div class="meta-label">
                    Location
                </div>

                <div class="meta-value">
                    ${location}
                </div>

            </div>


            <div>

                <div class="meta-label">
                    Department
                </div>

                <div class="meta-value">
                    ${department}
                </div>

            </div>

        </div>


        <div class="report-footer">

            <span class="report-open">
                Open Case →

            ${
                overdue
                ?
                '<span class="overdue-label">⚠ OVERDUE</span>'

/* =========================================================
   DRIVE FILE ID
   ========================================================= */

function extractDriveFileId(url){

    if(!url){

        return null;
    }


    const value =
        String(url).trim();


    const patterns = [

        /\/d\/([a-zA-Z0-9_-]+)/,

        /[?&]id=([a-zA-Z0-9_-]+)/,

        /\/file\/d\/([a-zA-Z0-9_-]+)/

    ];


    for(
        const pattern
        of patterns
    ){

        const match =
            value.match(pattern);


        if(
            match &&
            match[1]
        ){

            return match[1];
        }
    }


    return null;
}


/* =========================================================
   PHOTO LIST
   ========================================================= */

function getPhotoList(photoData){

    if(!photoData){

        return [];
    }


    if(Array.isArray(photoData)){

        return photoData

            .map(item =>

                typeof item === "string"

                ? item

                :

                (
                    item.url ||
                    item.photoUrl ||
                    item.photoData ||
                    ""
                )

            )

            .filter(Boolean);
    }


    const text =
        String(photoData).trim();


    if(!text){

        return [];
    }


    if(
        text.startsWith("[") &&
        text.endsWith("]")
    ){

        try{

            const parsed =
                JSON.parse(text);


            if(Array.isArray(parsed)){

                return parsed

                    .map(item =>

                        typeof item === "string"

                        ? item

                        :

                        (
                            item.url ||
                            item.photoUrl ||
                            ""
                        )

                    )

                    .filter(Boolean);
            }

        }catch(error){

            console.warn(
                "Photo JSON parse failed",
                error
            );
        }
    }


    return text

        .split(
            /\r?\n|,(?=https?:\/\/)|;(?=https?:\/\/)/
        )

        .map(
            item => item.trim()
        )

        .filter(Boolean);
}


/* =========================================================
   LOAD PHOTOS
   ========================================================= */

function loadPhotos(photoData){

    const container =
        document.getElementById(
            "photoEvidence"
        );


    if(!container){

        return;
    }


    container.innerHTML = "";


    const photoList =
        getPhotoList(
            photoData
        );


    if(
        photoList.length === 0
    ){

        container.innerHTML = `
        <div class="photo-placeholder">
            No photo evidence available
        </div>`;

        return;
    }


    const gallery =
        document.createElement(
            "div"
        );


    gallery.className =
        "photo-gallery";


    container.appendChild(
        gallery
    );


    photoList.forEach(
        (photo,index) => {

            createPhotoCard(
                photo,
                index + 1,
                gallery
            );

        }
    );
}


/* =========================================================
   PHOTO CARD
   ========================================================= */

function createPhotoCard(
    photoLink,
    photoNumber,
    gallery
){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "photo-card";


    const title =
        document.createElement(
            "div"
        );


    title.className =
        "photo-card-title";


    title.textContent =
        "Photo " +
        photoNumber;


    card.appendChild(
        title
    );


    const fileId =
        extractDriveFileId(
            photoLink
        );


    if(!fileId){

        const placeholder =
            document.createElement(
                "div"
            );


        placeholder.className =
            "photo-placeholder";


        placeholder.textContent =
            "Photo preview unavailable";


        card.appendChild(
            placeholder
        );


        const link =
            document.createElement(
                "a"
            );


        link.className =
            "photo-link";


        link.href =
            photoLink;


        link.target =
            "_blank";


        link.rel =
            "noopener noreferrer";


        link.textContent =
            "Open Photo ↗";


        card.appendChild(
            link
        );


        gallery.appendChild(
            card
        );


        return;
    }


    const imageWrapper =
        document.createElement(
            "div"
        );


    imageWrapper.className =
        "photo-image-wrapper";


    const img =
        document.createElement(
            "img"
        );


    img.className =
        "photo-evidence-image";


    img.alt =
        "Photo Evidence " +
        photoNumber;


    img.loading =
        "lazy";


    const urls = [

        `https://drive.google.com/thumbnail?id=${fileId}&sz=w1600`,

        `https://drive.google.com/uc?export=view&id=${fileId}`,

        `https://drive.google.com/uc?export=download&id=${fileId}`,

        `https://lh3.googleusercontent.com/d/${fileId}=w1600`

    ];


    let imageIndex = 0;


    function tryNextImage(){

        if(
            imageIndex >=
            urls.length
        ){

            imageWrapper.innerHTML = "";


            const placeholder =
                document.createElement(
                    "div"
                );


            placeholder.className =
                "photo-placeholder";


            placeholder.textContent =
                "Photo preview unavailable";


            imageWrapper.appendChild(
                placeholder
            );


            return;
        }


        img.src =
            urls[imageIndex++];
    }


    img.onload = function(){

        imageWrapper.innerHTML = "";

        imageWrapper.appendChild(
            img
        );
    };


    img.onerror = function(){

        tryNextImage();
    };


    imageWrapper.appendChild(
        img
    );


    card.appendChild(
        imageWrapper
    );


    const link =
        document.createElement(
            "a"
        );


    link.className =
        "photo-link";


    link.href =
        photoLink;


    link.target =
        "_blank";


    link.rel =
        "noopener noreferrer";


    link.textContent =
        "Open Full Photo ↗";


    card.appendChild(
        link
    );


    gallery.appendChild(
        card
    );


    tryNextImage();
}


/* =========================================================
   VIDEO
   ========================================================= */

function loadVideo(videoData){

    const container =
        document.getElementById(
            "videoEvidence"
        );


    if(!container){

        return;
    }


    container.innerHTML = "";


    if(!videoData){

        container.innerHTML = `
        <div class="photo-placeholder">
            No video evidence available
        </div>`;

        return;
    }


    let videoUrl = "";


    if(
        typeof videoData ===
        "string"
    ){

            videoData.trim();

    }else if(
        typeof videoData ===
        "object"
    ){

            videoData.url ||
            videoData.videoUrl ||
            "";
    }


    if(!videoUrl){

        container.innerHTML = `
        <div class="photo-placeholder">
            No video evidence available
        </div>`;

        return;
    }


    const fileId =
        extractDriveFileId(
            videoUrl
        );


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "photo-card";


    const title =
        document.createElement(
            "div"
        );


    title.className =
        "photo-card-title";


    title.textContent =
        "Video Evidence";


    card.appendChild(
        title
    );


    /*
       Google Drive video is displayed
       through the Drive preview iframe.
    */

    if(fileId){

        const wrapper =
            document.createElement(
                "div"
            );


        wrapper.style.width =
            "100%";


        wrapper.style.aspectRatio =
            "16 / 9";


        wrapper.style.overflow =
            "hidden";


        wrapper.style.borderRadius =
            "10px";


        wrapper.style.background =
            "#020b17";


        const iframe =
            document.createElement(
                "iframe"
            );


        iframe.src =
            "https://drive.google.com/file/d/" +
            fileId +
            "/preview";


        iframe.style.width =
            "100%";


        iframe.style.height =
            "100%";


        iframe.style.border =
            "0";


        iframe.setAttribute(
            "allow",
            "autoplay"
        );


        iframe.setAttribute(
            "allowfullscreen",
            ""
        );


        wrapper.appendChild(
            iframe
        );


        card.appendChild(
            wrapper
        );
    }


    const link =
        document.createElement(
            "a"
        );


    link.className =
        "photo-link";


    link.href =
        videoUrl;


    link.target =
        "_blank";


    link.rel =
        "noopener noreferrer";


    link.textContent =
        "Open Video ↗";


    card.appendChild(
        link
    );


    container.appendChild(
        card
    );

/* =========================================================
   TIMELINE
   ========================================================= */

function updateTimeline(status){

    const steps =
        document.querySelectorAll(
            "#timeline .timeline-step"
        );


    const order = [

        "new",

        "investigation",

        "corrective action",

        "verification",

        "closed"

    ];


    const current =
        order.indexOf(
            normalizeStatus(status)
        );


    steps.forEach(
        (step,index) => {

            step.classList.remove(
                "active",
                "completed"
            );


            if(index < current){

                step.classList.add(
                    "completed"
                );
            }


            if(index === current){

                step.classList.add(
                    "active"
                );
            }

        }
    );
}


/* =========================================================
   SAVE REPORT
   ========================================================= */

async function saveReport(){

    if(!selectedReport){

        return;
    }


    const status =
        document.getElementById(
            "caseStatus"
        ).value;


    const investigationFindings =
        document.getElementById(
            "investigationFindings"
        ).value.trim();


    const rootCause =
        document.getElementById(
            "rootCause"
        ).value.trim();


    const correctiveAction =
        document.getElementById(
            "correctiveAction"
        ).value.trim();


    const personResponsible =
        document.getElementById(
            "personResponsible"
        ).value.trim();


    const dueDate =
        document.getElementById(
            "dueDate"
        ).value;


    const verificationRemarks =
        document.getElementById(
            "verificationRemarks"
        ).value.trim();


    let closedDate =
        document.getElementById(
            "closedDate"
        ).value;


    const eshInvestigator =
        document.getElementById(
            "eshInvestigator"
        ).value.trim();


    const eshRemarks =
        document.getElementById(
            "eshRemarks"
        ).value.trim();


    if(
        status === "Investigation" &&
        !investigationFindings
    ){

        alert(
            "Please enter Investigation Findings."
        );

        return;
    }


    if(
        status === "Corrective Action" &&
        !correctiveAction
    ){

        alert(
            "Please enter Corrective Action."
        );

        return;
    }


    if(
        status === "Closed" &&
        !verificationRemarks
    ){

        alert(
            "Please enter Verification Remarks before closing the case."
        );

        return;
    }


    if(
        status === "Closed" &&
        !closedDate
    ){

        closedDate =
            new Date()
            .toISOString()
            .split("T")[0];
    }


    if(
        status !== "Closed"
    ){

        closedDate = "";
    }


    const data = {

        action:
            "updateReport",

        rowNumber:
            selectedReport.rowNumber,

        status:
            status,

        investigationFindings:
            investigationFindings,

        rootCause:
            rootCause,

        correctiveAction:
            correctiveAction,

        personResponsible:
            personResponsible,

        dueDate:
            dueDate,

        verificationRemarks:
            verificationRemarks,

        eshInvestigator:
            eshInvestigator,

        eshRemarks:
            eshRemarks,

        closedDate:
            closedDate
    };


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    const originalText =
        saveButton.textContent;


    saveButton.disabled = true;

    saveButton.textContent =
        "Saving...";


    try{

        const response =
            await fetch(
                GOOGLE_SCRIPT_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify(data)
                }
            );


        const result =
            await response.text();


        console.log(
            "Save result:",
            result
        );


        await loadReports();


        alert(
            "Report updated successfully."
        );


        closeModal();


    }catch(error){

        console.error(
            "Save error:",
            error
        );


        alert(
            "Unable to save report. Please try again."
        );


    }finally{

        saveButton.disabled =
            false;

        saveButton.textContent =
            originalText;
    }
}

/* =========================================================

function renderCategory(){

    const container =
        document.getElementById(
            "categoryChart"
        );


    const counts = {};


    reports.forEach(
        report => {

            const category =
                report.hazardCategory ||
                report.category ||
                "Uncategorized";


            counts[category] =
                (
                    counts[category] || 0
                ) + 1;
        }
    );


    const entries =
        Object.entries(counts)
        .sort(
            (a,b) =>
                b[1] - a[1]
        );


    if(!entries.length){

        container.innerHTML =
            '<div class="empty-text">No category data</div>';

        return;
    }


    const max =
        Math.max(
            ...entries.map(
                x => x[1]
            )
        );


    container.innerHTML =
        entries
        .slice(0,8)
        .map(entry => {

            const width =
                (entry[1] / max) *
                100;


            return `

            <div class="chart-row">

                <div class="chart-row-label">
                    ${escapeHtml(entry[0])}
                </div>

                <div class="chart-track">

                    <div
                        class="chart-fill"
                        style="width:${width}%"
                    ></div>

                </div>

                <div class="chart-number">
                    ${entry[1]}
                </div>

            </div>

            `;

        })
        .join("");
}

/* =========================================================
   7 DAY TREND
   ========================================================= */

function renderTrend(){

    const container =
        document.getElementById(
            "trendChart"
        );


    const today =
        new Date();


    today.setHours(
        0,0,0,0
    );


    const days = [];


    for(
        let i = 6;
        i >= 0;
        i--
    ){

        const date =
            new Date(today);


        date.setDate(
            today.getDate() - i
        );


        days.push(
            date
        );
    }


    const counts =
        days.map(
            day => {

                return reports.filter(
                    report => {

                        const raw =
                            report.dateTime ||
                            report.timestamp ||
                            report.date ||
                            report.createdDate ||
                            report.submittedAt;


                        const date =
                            parseDate(raw);


                        if(!date){

                            return false;
                        }


                        date.setHours(
                            0,0,0,0
                        );


                        return (
                            date.getTime() ===
                            day.getTime()
                        );
                    }
                ).length;

            }
        );


    const max =
        Math.max(
            1,
            ...counts
        );


    container.innerHTML =
        days.map(
            (day,index) => {

                const count =
                    counts[index];


                const height =
                    Math.max(
                        5,
                        (count / max) *
                        175
                    );


                const label =
                    day.toLocaleDateString(
                        "en-MY",
                        {
                            day:"2-digit",
                            month:"short"
                        }
                    );


                return `

                <div class="trend-bar-wrap">

                    <div class="trend-value">
                        ${count}
                    </div>

                    <div
                        class="trend-bar"
                        style="height:${height}px"
                    ></div>

                    <div class="trend-label">
                        ${label}
                    </div>

                </div>

                `;

            }
        ).join("");
}

function populateCategoryFilter(){

    const select =
        document.getElementById(
            "categoryFilter"
        );


    const current =
        select.value;


    const categories = [

        ...new Set(

            reports

                .map(
                    report =>
                        report.hazardCategory ||
                        report.category
                )

                .filter(Boolean)

        )

    ].sort();


    select.innerHTML =
        '<option value="">All Categories</option>';


    categories.forEach(
        category => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                category;


            option.textContent =
                category;


            select.appendChild(
                option
            );
        }
    );


    if(
        categories.includes(
            current
        )
    ){

        select.value =
            current;
    }
}

/* =========================================================
   HELPERS
   ========================================================= */

function normalizeStatus(status){

    return String(
        status || ""
    )
    .trim()
    .toLowerCase();
}


function getStatusClass(status){

    switch(
        normalizeStatus(status)
    ){

        case "new":

            return "status-new";


        case "investigation":

            return "status-investigation";


        case "corrective action":

            return "status-corrective";


        case "verification":

            return "status-verification";


        case "closed":

            return "status-closed";


        default:

            return "status-new";
    }
}


function parseDate(value){

    if(!value){

        return null;
    }


    if(value instanceof Date){

        return new Date(
            value.getTime()
        );
    }


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return null;
    }


    return date;
}


function formatDateInput(value){

    if(!value){

        return "";
    }


    const date =
        parseDate(value);


    if(!date){

        return "";
    }


    return (

        date.getFullYear() +

        "-" +

        String(
            date.getMonth() + 1
        ).padStart(2,"0") +

        "-" +

        String(
            date.getDate()
        ).padStart(2,"0")

    );
}


function formatDisplayDate(value){

    if(!value){

        return "-";
    }


    const date =
        parseDate(value);


    if(!date){

        return String(value);
    }


    return date.toLocaleDateString(
        "en-MY",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );
}


function escapeHtml(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );
}


function escapeAttribute(value){

    return escapeHtml(
        value
    );
}
