<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Near Miss Reporting System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Near Miss Report</h1>

        <p class="subtitle">
            ESH Near Miss Reporting System
        </p>


        <form id="nearMissForm">

            <!-- DATE & TIME -->
            <label for="dateTime">
                Date & Time
            </label>

            <input
                type="datetime-local"
                id="dateTime"
                name="dateTime"
                required
            >


            <!-- LOCATION -->
            <label for="location">
                Location
            </label>

            <input
                type="text"
                id="location"
                name="location"
                placeholder="Enter location"
                required
            >


            <!-- DEPARTMENT -->
            <label for="department">
                Department
            </label>

            <select
                id="department"
                name="department"
                required
            >

                <option value="">
                    Select Department
                </option>

                <option value="Production">
                    Production
                </option>

                <option value="Warehouse">
                    Warehouse
                </option>

                <option value="Maintenance">
                    Maintenance
                </option>

                <option value="Quality">
                    Quality
                </option>

                <option value="Engineering">
                    Engineering
                </option>

                <option value="ESH">
                    ESH
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <!-- HAZARD CATEGORY -->
            <label for="hazardCategory">
                Hazard Category
            </label>

            <select
                id="hazardCategory"
                name="hazardCategory"
                required
            >

                <option value="">
                    Select Category
                </option>

                <option value="Near Miss">
                    Near Miss
                </option>

                <option value="Unsafe Act">
                    Unsafe Act
                </option>

                <option value="Unsafe Condition">
                    Unsafe Condition
                </option>

            </select>


            <!-- WHAT HAPPENED -->
            <label for="whatHappened">
                What happened?
            </label>

            <textarea
                id="whatHappened"
                name="whatHappened"
                rows="5"
                placeholder="Describe what happened..."
                required
            ></textarea>


            <!-- REPORTER NAME -->
            <label for="reporterName">
                Reporter Name
            </label>

            <input
                type="text"
                id="reporterName"
                name="reporterName"
                placeholder="Enter your name"
                required
            >


            <!-- MULTIPLE PHOTOS -->
            <label for="photo">
                Photos
            </label>

            <input
                type="file"
                id="photo"
                name="photo"
                accept="image/*"
                multiple
            >

            <div
                id="photoCount"
                style="
                    margin-top:8px;
                    font-size:14px;
                    color:#666;
                "
            >
                No photos selected
            </div>


            <!-- SUBMIT -->
            <button
                type="submit"
                class="submit-button"
            >
                SUBMIT NEAR MISS
            </button>

        </form>


        <!-- SUCCESS MESSAGE -->
        <div
            id="successMessage"
            class="success-message"
        >
            Report submitted successfully!
        </div>

    </div>


    <!-- PHOTO COUNT SCRIPT -->
    <script>

        const photoInput =
            document.getElementById("photo");

        const photoCount =
            document.getElementById("photoCount");


        photoInput.addEventListener(
            "change",
            function () {

                const count =
                    photoInput.files.length;


                if (count === 0) {

                    photoCount.textContent =
                        "No photos selected";

                }

                else if (count === 1) {

                    photoCount.textContent =
                        "1 photo selected";

                }

                else {

                    photoCount.textContent =
                        count + " photos selected";

                }

            }
        );

    </script>


    <!-- MAIN JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
