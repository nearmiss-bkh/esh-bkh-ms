<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Near Miss Reporting System</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="container">

    <h1>Near Miss Report</h1>

    <p class="subtitle">
        ESH Near Miss Reporting System
    </p>


    <!-- ========================================= -->
    <!-- NEAR MISS FORM -->
    <!-- ========================================= -->

    <form id="nearMissForm">


        <!-- DATE & TIME -->

        <label for="dateTime">
            Date &amp; Time
        </label>

        <input
            type="datetime-local"
            id="dateTime"
            name="dateTime"
            required
            readonly
        >


        <!-- LOCATION -->

        <label for="location">
            Location
        </label>

        <input
            type="text"
            id="location"
            name="location"
            placeholder="Enter location"
            required
        >


        <!-- DEPARTMENT -->

        <label for="department">
            Department
        </label>

        <select
            id="department"
            name="department"
            required
        >

            <option value="">
                Select Department
            </option>

            <option value="Production">
                Production
            </option>

            <option value="Warehouse">
                Warehouse
            </option>

            <option value="Maintenance">
                Maintenance
            </option>

            <option value="Quality">
                Quality
            </option>

            <option value="Engineering">
                Engineering
            </option>

            <option value="ESH">
                ESH
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <!-- HAZARD CATEGORY -->

        <label for="hazardCategory">
            Hazard Category
        </label>

        <select
            id="hazardCategory"
            name="hazardCategory"
            required
        >

            <option value="">
                Select Category
            </option>

            <option value="Near Miss">
                Near Miss
            </option>

            <option value="Unsafe Act">
                Unsafe Act
            </option>

            <option value="Unsafe Condition">
                Unsafe Condition
            </option>

        </select>


        <!-- WHAT HAPPENED -->

        <label for="whatHappened">
            What happened?
        </label>

        <textarea
            id="whatHappened"
            name="whatHappened"
            rows="5"
            placeholder="Describe what happened..."
            required
        ></textarea>


        <!-- REPORTER NAME -->

        <label for="reporterName">
            Reporter Name
        </label>

        <input
            type="text"
            id="reporterName"
            name="reporterName"
            placeholder="Enter your name"
            required
        >


        <!-- ========================================= -->
        <!-- PHOTOS -->
        <!-- ========================================= -->

        <label for="photo">
            Photos
        </label>

        <input
            type="file"
            id="photo"
            name="photo"
            accept="image/*"
            multiple
        >

        <div
            id="photoCount"
            style="
                margin-top:8px;
                font-size:14px;
                color:#666;
            "
        >
            No photos selected
        </div>

        <div
            style="
                margin-top:5px;
                font-size:12px;
                color:#888;
            "
        >
            Maximum 10 photos
        </div>


        <!-- ========================================= -->
        <!-- VIDEO -->
        <!-- ========================================= -->

        <label
            for="video"
            style="margin-top:20px;"
        >
            Video
        </label>

        <input
            type="file"
            id="video"
            name="video"
            accept="video/*"
        >

        <div
            id="videoInfo"
            style="
                margin-top:8px;
                font-size:14px;
                color:#666;
            "
        >
            No video selected
        </div>

        <div
            style="
                margin-top:5px;
                font-size:12px;
                color:#888;
            "
        >
            Video is optional. Recommended maximum size: 50 MB.
        </div>


        <!-- VIDEO PREVIEW -->

        <video
            id="videoPreview"
            controls
            style="
                display:none;
                width:100%;
                max-height:300px;
                margin-top:15px;
                border-radius:10px;
            "
        ></video>


        <!-- ========================================= -->
        <!-- SUBMIT BUTTON -->
        <!-- ========================================= -->

        <button
            type="submit"
            class="submit-button"
        >
            SUBMIT NEAR MISS
        </button>

    </form>


    <!-- SUCCESS / ERROR MESSAGE -->

    <div
        id="successMessage"
        class="success-message"
    ></div>

</div>


<!-- ============================================= -->
<!-- PHOTO COUNT -->
<!-- ============================================= -->

<script>

const photoInput =
    document.getElementById("photo");

const photoCount =
    document.getElementById("photoCount");


photoInput.addEventListener(
    "change",
    function () {

        const files =
            this.files;

        if (!files.length) {

            photoCount.textContent =
                "No photos selected";

            return;
        }


        if (files.length > 10) {

            alert(
                "Maximum 10 photos allowed."
            );

            this.value = "";

            photoCount.textContent =
                "No photos selected";

            return;
        }


        photoCount.textContent =
            files.length +
            " photo" +
            (files.length > 1 ? "s" : "") +
            " selected";

    }
);

</script>


<!-- ============================================= -->
<!-- VIDEO SELECTION + PREVIEW -->
<!-- ============================================= -->

<script>

const videoInput =
    document.getElementById("video");

const videoInfo =
    document.getElementById("videoInfo");

const videoPreview =
    document.getElementById("videoPreview");


videoInput.addEventListener(
    "change",
    function () {

        const file =
            this.files[0];


        if (!file) {

            videoInfo.textContent =
                "No video selected";

            videoPreview.style.display =
                "none";

            videoPreview.removeAttribute(
                "src"
            );

            return;
        }


        const sizeMB =
            file.size /
            (1024 * 1024);


        videoInfo.textContent =
            file.name +
            " (" +
            sizeMB.toFixed(1) +
            " MB)";


        const videoURL =
            URL.createObjectURL(file);


        videoPreview.src =
            videoURL;

        videoPreview.style.display =
            "block";

    }
);

</script>


<!-- ============================================= -->
<!-- MALAYSIA DATE & TIME -->
<!-- ============================================= -->

<script>

function updateDateTime() {

    const dateTime =
        document.getElementById("dateTime");

    if (!dateTime) {
        return;
    }

    const now =
        new Date();

    const malaysiaTime =
        new Date(
            now.toLocaleString(
                "en-US",
                {
                    timeZone:
                        "Asia/Kuala_Lumpur"
                }
            )
        );

    const year =
        malaysiaTime.getFullYear();

    const month =
        String(
            malaysiaTime.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            malaysiaTime.getDate()
        ).padStart(2, "0");

    const hour =
        String(
            malaysiaTime.getHours()
        ).padStart(2, "0");

    const minute =
        String(
            malaysiaTime.getMinutes()
        ).padStart(2, "0");

    dateTime.value =
        year +
        "-" +
        month +
        "-" +
        day +
        "T" +
        hour +
        ":" +
        minute;
}


updateDateTime();


setInterval(
    updateDateTime,
    10000
);

</script>


<!-- ============================================= -->
<!-- MAIN JAVASCRIPT -->
<!-- ============================================= -->

<script src="script.js"></script>


</body>

</html>
